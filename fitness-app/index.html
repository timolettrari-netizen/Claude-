<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness-Coach</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#F2F2F7;--card:#FFFFFF;--card2:rgba(118,118,128,.12);--ink:#000000;--mut:rgba(60,60,67,.6);--mut3:rgba(60,60,67,.3);--line:rgba(60,60,67,.2);
  --go:#007AFF;--ongo:#FFFFFF;--teal:#30B0C7;--vio:#AF52DE;--blue:#007AFF;--acc:var(--go);
  --ok:#34C759;--bad:#FF3B30;--warn:#FF9500;--hot:#FF3B30;
  --orange:#FF9500;--green:#34C759;--purple:#AF52DE;--pink:#FF2D55;--cyan:#32ADE6;--indigo:#5856D6;--yellow:#FFCC00;--red:#FF3B30;--mint:#00C7BE;
  --sp:#FFCC00;--fn:#AF52DE;--fr:rgba(52,199,89,.16);--shk:#1C1C1E;
  --spT:#9A5B00;--fnT:#8944AB;--frT:#248A3D;--orT:#C93400;
  --bar:rgba(249,249,249,.92);--segon:#FFFFFF;--sh:none;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --rnd:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1C1C1E;--card2:rgba(118,118,128,.24);--ink:#FFFFFF;--mut:rgba(235,235,245,.6);--mut3:rgba(235,235,245,.3);--line:rgba(84,84,88,.6);
    --go:#0A84FF;--ongo:#FFFFFF;--teal:#40C8E0;--vio:#BF5AF2;--blue:#0A84FF;
    --ok:#30D158;--bad:#FF453A;--warn:#FF9F0A;--hot:#FF453A;
    --orange:#FF9F0A;--green:#30D158;--purple:#BF5AF2;--pink:#FF375F;--cyan:#64D2FF;--indigo:#5E5CE6;--yellow:#FFD60A;--red:#FF453A;--mint:#63E6E2;
    --sp:#FFD60A;--fn:#BF5AF2;--fr:rgba(48,209,88,.2);
    --spT:#FFD60A;--fnT:#DA8FFF;--frT:#30D158;--orT:#FF9F0A;
    --bar:rgba(22,22,24,.88);--segon:#636366;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:rgba(118,118,128,.24);--ink:#FFFFFF;--mut:rgba(235,235,245,.6);--mut3:rgba(235,235,245,.3);--line:rgba(84,84,88,.6);
  --go:#0A84FF;--ongo:#FFFFFF;--teal:#40C8E0;--vio:#BF5AF2;--blue:#0A84FF;
  --ok:#30D158;--bad:#FF453A;--warn:#FF9F0A;--hot:#FF453A;
  --orange:#FF9F0A;--green:#30D158;--purple:#BF5AF2;--pink:#FF375F;--cyan:#64D2FF;--indigo:#5E5CE6;--yellow:#FFD60A;--red:#FF453A;--mint:#63E6E2;
  --sp:#FFD60A;--fn:#BF5AF2;--fr:rgba(48,209,88,.2);
  --spT:#FFD60A;--fnT:#DA8FFF;--frT:#30D158;--orT:#FF9F0A;
  --bar:rgba(22,22,24,.88);--segon:#636366;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 44px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.2px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:44px 16px 120px}
header{margin:2px 4px 16px}
.date{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:0}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;line-height:1.15;margin:2px 0 0}
h2{font-size:22px;font-weight:700;line-height:1.2;margin:0 0 10px;letter-spacing:.1px}
h3{font-size:17px;margin:0 0 4px;font-weight:600}
.sh{font-size:22px;font-weight:700;margin:22px 4px 10px}
.pill,.pill[hidden]{display:none}
.muted{color:var(--mut)}.small{font-size:13px;letter-spacing:0}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.f{flex:1 1 90px;min-width:80px}
label{display:block;font-size:13px;color:var(--mut);font-weight:400;margin:0 0 5px 2px}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--card2);border:0;border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--go) 60%,transparent);outline-offset:2px}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--go);color:var(--ongo);padding:12px 18px;min-height:50px;cursor:pointer;letter-spacing:-.2px;transition:opacity .15s}
button:active{opacity:.6}
button.sec{background:var(--card2);color:var(--go)}
button.ghost{background:transparent;color:var(--go)}
button.sm{min-height:34px;padding:6px 14px;font-size:15px;border-radius:999px}
button.x{min-width:30px;height:30px;min-height:30px;padding:0 9px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:14px;font-weight:700}
button.big{min-height:50px;width:100%}
.card,.tcard{background:var(--card);border-radius:12px;padding:16px;margin:0 0 12px;border:0;box-shadow:none}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px}
.ib{flex:none;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff}
.ib .ic{width:19px;height:19px;stroke-width:2.2}
.sub{font-size:15px;color:var(--mut)}
.cat{display:flex;align-items:center;gap:6px;color:var(--c,var(--go));font-size:15px;font-weight:600}
.cat .ic{width:18px;height:18px;stroke-width:2.3}
.cat .tm{margin-left:auto;color:var(--mut);font-weight:400;font-size:15px}
.ft{font-size:22px;font-weight:700;margin:10px 0 2px;line-height:1.2}
.fs{color:var(--mut);font-size:15px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px 14px;min-width:0;text-align:left;color:var(--ink)}
button.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:0;font-weight:400;font-size:17px;padding:12px 14px 14px;border-radius:12px}
.val{font-family:var(--rnd);font-size:28px;font-weight:700;margin-top:12px;line-height:1.1;white-space:nowrap;letter-spacing:0}
.val small{font-family:var(--font);font-size:15px;font-weight:600;color:var(--mut);margin-left:3px}
.tile .sub{font-size:13px;margin-top:3px}
.tile .bar{margin-top:10px;height:6px}
.act .hero{display:flex;gap:20px;align-items:center}
.rings{width:136px;height:136px;flex:none}
.rings svg{width:100%;height:100%;display:block}
.leg{flex:1;min-width:0}
.leg div{margin-bottom:10px}.leg div:last-child{margin:0}
.leg .k{font-size:15px;font-weight:600;color:var(--ink)}
.leg .v{font-family:var(--rnd);font-size:22px;font-weight:700;color:var(--c);line-height:1.15}
.leg .v small{font-size:14px;font-weight:700;margin-left:2px}
.chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;letter-spacing:0}
.c-F{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--frT)}
.c-D{background:color-mix(in srgb,var(--yellow) 28%,transparent);color:var(--spT)}
.c-N{background:color-mix(in srgb,var(--purple) 18%,transparent);color:var(--fnT)}
.c-S{background:var(--card2);color:var(--mut)}
.c-run{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--frT)}
.c-kb{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orT)}
.coach{display:flex;gap:12px}
.coach .av{flex:none;width:30px;height:30px;border-radius:7px;background:var(--go);color:#fff;display:flex;align-items:center;justify-content:center}
.coach .av .ic{width:19px;height:19px;stroke-width:2.2}
.coach .tx p{margin:0 0 8px;font-size:15px;line-height:1.4}.coach .tx p:last-child{margin:0}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px}
.split span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;border-radius:10px;padding:8px 2px 7px;font-size:12px;min-width:0}
.wd.today{background:var(--card2)}
.wd .dn{color:var(--mut);font-weight:600;display:block;font-size:11px}
.wd .dd{font-weight:600;font-size:18px;display:block;margin:2px 0 5px}
.wd.today .dd{color:var(--go)}
.wd .tg{display:block;font-size:11px;min-height:16px}
.wd .st{display:block;height:4px;border-radius:2px;background:var(--card2);margin:6px 6px 0;overflow:hidden}
.wd .st i{display:block;height:100%;background:var(--pink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--mut);font-weight:600}
.cal button{background:var(--card2);color:var(--ink);padding:2px 0;min-height:52px;font-weight:600;font-size:16px;border-radius:10px;line-height:1.2}
.cal button.today{box-shadow:inset 0 0 0 2px var(--go)}
.cal button.F{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--frT)}
.cal button.D{background:color-mix(in srgb,var(--yellow) 30%,transparent);color:var(--spT)}
.cal button.N{background:color-mix(in srgb,var(--purple) 18%,transparent);color:var(--fnT)}
.cal button small{display:block;font-size:10.5px;opacity:.85;font-weight:600}
.cal button.past{opacity:.45}
details.s{border-top:.5px solid var(--line);padding:12px 0}
details.s:first-of-type{border-top:0;padding-top:0}
details.s summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:36px}
details.s summary::-webkit-details-marker{display:none}
ul.pl{margin:8px 0 0;padding-left:20px}ul.pl li{margin-bottom:4px;font-size:15px}
.exl .ex{padding:11px 0;border-top:.5px solid var(--line)}
.exl .ex:first-child{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exh b{font-weight:600}
.exh span{color:var(--mut);font-size:15px;white-space:nowrap}
.cue{font-size:15px;color:var(--mut);margin:6px 0 0;padding-left:18px}
.cue li{margin-bottom:3px}
a.vid{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;font-size:15px;color:var(--go);text-decoration:none;background:color-mix(in srgb,var(--go) 12%,transparent);border-radius:999px;padding:6px 14px;min-height:34px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:.5px solid var(--line);font-size:17px;min-height:44px}
.list .it:first-child{border-top:0}
.wk{display:grid;grid-template-columns:48px 1fr 74px;gap:10px;align-items:center;font-size:13px;margin:6px 0 2px;font-weight:600}
.wk .bar{height:12px}
.wk+.small{margin:0 0 8px 58px}
.navbar{position:fixed;top:0;left:0;right:0;z-index:9;padding-top:env(safe-area-inset-top,0px);border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.navbar .nbi{max-width:560px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:center;position:relative}
.navbar .nbt{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s}
.navbar .nbb{position:absolute;right:10px;top:6px;width:36px;height:32px;min-height:32px;padding:0;background:transparent;color:var(--go);border-radius:8px;display:flex;align-items:center;justify-content:center}
.navbar .nbb .ic{width:30px;height:30px}
body.scrolled .navbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line)}
body.scrolled .navbar .nbt{opacity:1}
.navwrap{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
nav{max-width:560px;margin:0 auto;display:flex;padding:0 0 env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:#8E8E93;border-radius:0;min-height:50px;padding:6px 0 3px;font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;letter-spacing:.1px}
nav button.on{color:var(--go)}
nav .ic{width:26px;height:26px}
nav button.on .ic{stroke-width:2.2}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ovl{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.ovl .in{max-width:560px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;min-height:100%;padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.ovl .in::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--mut3);margin:0 auto 14px}
.ovl h1{font-size:28px}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;margin:0 0 8px;min-height:62px;font-weight:400;font-size:17px}
.pick b{font-weight:600}
.pick .em{flex:none;width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--card2);font-size:21px}
.pick.pl{box-shadow:inset 0 0 0 2px var(--go)}
.pick small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.timer{text-align:center;font-family:var(--rnd);font-size:76px;font-weight:700;letter-spacing:0;line-height:1;margin:22px 0 6px}
.gps{text-align:center;margin-bottom:14px}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.tg3>div{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;min-width:0}
.card .tg3>div{background:var(--card2)}
.tg3 b{display:block;font-family:var(--rnd);font-size:26px;font-weight:700;line-height:1.1}
.tg3 span{font-size:12px;color:var(--mut)}
.sets{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sets button{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:var(--card2);color:var(--mut);font-size:16px}
.sets button.d{background:var(--green);color:#fff}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wide{grid-column:1/-1}
.dsel{display:flex;gap:2px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.dsel::-webkit-scrollbar{display:none}
.dsel button{flex:none;width:52px;min-height:66px;padding:6px 0;border-radius:12px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:500}
.dsel button span{color:var(--mut);font-size:11px;font-weight:600}
.dsel button b{font-size:20px;font-weight:600}
.dsel button small{font-size:10.5px;color:var(--mut)}
.dsel button.on{background:var(--go);color:#fff}
.dsel button.on span,.dsel button.on small{color:rgba(255,255,255,.85)}
.mrow{display:flex;gap:14px;align-items:center;margin:12px 0}
.plate{width:84px;height:84px;flex:none}
img.plate{object-fit:cover;border-radius:12px;background:var(--card2)}
.macro{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:15px;margin:8px 0}
.macro .bar{height:8px}
.macro span{white-space:nowrap}.macro span:first-child{min-width:104px}.macro span:last-child{text-align:right;color:var(--mut)}
.ing{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:17px;margin:8px 0 0;padding:0;list-style:none}
.ing li{display:contents}
.ing b{font-weight:600;text-align:right;white-space:nowrap}
ol.st{margin:8px 0 0;padding-left:22px}ol.st li{margin-bottom:8px;font-size:17px}
.dev{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut);margin:0 6px 4px 0}
.tip{background:color-mix(in srgb,var(--go) 11%,var(--card));border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 12px}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;background:transparent;color:var(--ink);min-height:32px;border-radius:7px;font-size:13px;font-weight:500;padding:4px}
.seg button.on{background:var(--segon);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.rowb{display:flex;gap:12px;align-items:center;width:100%;background:transparent;color:var(--ink);border-radius:0;border-top:.5px solid var(--line);padding:10px 0;text-align:left;min-height:60px;font-weight:400;font-size:17px}
.rowb:first-of-type{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--card);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:40;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.enter{animation:vin .25s ease-out}
@keyframes vin{from{opacity:0}to{opacity:1}}
@keyframes ringin{from{stroke-dasharray:0 100}}
.first .rings circle[stroke-linecap]{animation:ringin 1s cubic-bezier(.2,.8,.2,1)}
svg text{font-family:var(--font)}
.gkframe{position:fixed;left:0;right:0;top:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));width:100%;height:calc(100% - 50px - env(safe-area-inset-bottom,0px));border:0;z-index:8;background:#0A0A0B;display:none}
body[data-tab="torwart"] .gkframe{display:block}body[data-tab="torwart"] .navbar,body[data-tab="torwart"] .wrap{display:none}
body[data-tab="torwart"] .navwrap{background:rgba(10,10,11,.92);border-top-color:rgba(255,255,255,.08)}body[data-tab="torwart"] nav button.on{color:#C6F432}
.c-gk{background:color-mix(in srgb,#9BC41C 22%,transparent);color:#5E7F00}
@media (prefers-color-scheme:dark){.c-gk{color:#C6F432}}
@media (max-width:370px){.act .hero{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Sport-Design (wie Torwart-Training) ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --bg:#0A0A0B;--card:#161618;--card2:rgba(255,255,255,.08);--ink:#F5F5F7;--mut:rgba(235,235,245,.55);--mut3:rgba(235,235,245,.25);--line:rgba(255,255,255,.08);
  --go:#C6F432;--ongo:#0A0A0B;--teal:#64D2FF;--vio:#BF5AF2;--blue:#4DA3FF;
  --ok:#C6F432;--bad:#FF453A;--warn:#FF9F0A;--hot:#FF453A;
  --orange:#FF9F0A;--green:#30D158;--purple:#BF5AF2;--pink:#FF375F;--cyan:#64D2FF;--indigo:#7D7AFF;--yellow:#FFD60A;--red:#FF453A;--mint:#63E6E2;
  --sp:#FFD60A;--fn:#BF5AF2;--fr:rgba(48,209,88,.2);
  --spT:#FFD60A;--fnT:#DA8FFF;--frT:#30D158;--orT:#FF9F0A;
  --bar:rgba(10,10,11,.88);--segon:#3A3A3E;
}
html{color-scheme:dark}
h1,h2,.sh,.ft,.ovl h1{font-family:"Barlow Condensed",var(--font);text-transform:uppercase;font-style:italic;font-weight:800;letter-spacing:.3px}
h1{font-size:42px;line-height:1}.ovl h1{font-size:34px}h2{font-size:26px}.sh{font-size:28px}.ft{font-size:28px}
.date{color:var(--go)}

<script>

const STRAVA=[

const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

/* Übungsbibliothek: Technikhinweise + Video-Suche */
const LIB={
 swing:{n:'Kettlebell-Swing',q:'Kettlebell Swing Technik Anfänger',cue:['Füße schulterbreit, Hüfte weit nach hinten schieben, Rücken gerade.','Die Hüfte streckt sich und schwingt das Bell bis Brusthöhe – nicht mit den Armen anheben.','Oben Gesäß und Bauch fest, unten das Bell zurück zwischen die Beine schwingen lassen.']},
 goblet:{n:'Goblet Squat',q:'Goblet Squat Kettlebell Technik',cue:['Bell mit beiden Händen vor der Brust halten, Ellbogen zeigen nach unten.','Tief in die Hocke, Knie folgen den Zehen, Brust bleibt aufrecht.','Aus den Fersen hochdrücken.']},
 rdl1:{n:'Einbeiniges Kreuzheben',q:'Einbeiniges Rumänisches Kreuzheben Kettlebell Technik',cue:['Auf einem Bein stehen, Knie leicht gebeugt, Bell in einer Hand.','Hüfte nach hinten schieben, Rücken bleibt gerade, das freie Bein geht nach hinten.','Mit dem Gesäß des Standbeins wieder aufrichten.']},
 farmer:{n:'Farmer’s Walk',q:'Farmers Walk Kettlebell Technik',cue:['Bell seitlich halten, Schultern weg von den Ohren.','Aufrecht gehen, Rumpf fest, kleine ruhige Schritte.','Nach der Hälfte die Seite wechseln.']},
 plank:{n:'Plank',q:'Plank richtig ausführen Anfänger',cue:['Unterarme unter den Schultern, der Körper bildet eine Linie.','Gesäß und Bauch anspannen, nicht ins Hohlkreuz fallen.','Ruhig weiteratmen.']},
 clean:{n:'Clean & Press',q:'Kettlebell Clean and Press Technik',cue:['Mit dem Hüftschwung das Bell zur Schulter ziehen, Handgelenk gerade.','Von der Schulter über den Kopf drücken, Rumpf fest.','Kontrolliert zurück zur Schulter und ablegen.']},

 floor:{n:'Floor Press',q:'Kettlebell Floor Press Technik',cue:['Auf dem Rücken liegen, Knie angewinkelt, Bell an der Schulter.','Nach oben drücken, bis der Arm gestreckt ist.','Den Oberarm sanft am Boden ablegen, nicht absacken lassen.']},
 halo:{n:'Halo',q:'Kettlebell Halo Übung',cue:['Bell mit beiden Händen vor der Brust halten, aufrecht stehen.','Das Bell eng um den Kopf kreisen lassen.','Rumpf fest halten, nach der Hälfte die Richtung wechseln.']},
 twist:{n:'Russian Twist',q:'Russian Twist Kettlebell Technik',cue:['Sitzen, Oberkörper leicht nach hinten, Rücken lang.','Das Bell von Seite zu Seite führen, der Oberkörper dreht mit.','Füße am Boden lassen, wenn es zu schwer ist.']}
};
const vid=k=>'https://www.youtube.com/results?search_query='+encodeURIComponent(LIB[k].q);

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monOf=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const nf=(n,d=0)=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const todayS=()=>fmt(new Date());
const r5=x=>Math.round(x*2)/2;
const mmss=m=>{const s=Math.round(m*60);return Math.floor(s/60)+':'+pad(s%60)};
const clock=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)};
const SH={F:'frei',D:'Spät',N:'Früh/Nacht'},SHS={F:'frei',D:'Spät',N:'F/N'};
const ic={
 home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
 chart:'<path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/>',
 set:'<path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/>',
 food:'<path d="M7 3v6M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10v11M17 21V3c-2.2 1.6-3.5 4.2-3.5 7.5V14H17"/>',
 flame:'<path d="M12 3c1 3.2 4.5 5 4.5 9.2a4.5 4.5 0 0 1-9 0c0-2 1-3.200 2.200-4.200.2 1.800 1 2.200 1.500 2.200C11 8.500 11 5.500 12 3z"/>',
 scale:'<rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.500 9.500a4.500 3.500 0 0 1 7 0M12 9.800l1.600-1.800"/>',
 bolt:'<path d="M13 3L5.500 13.200H11L10 21l7.500-10.200H12z"/>',
 person:'<circle cx="12" cy="5" r="2"/><path d="M12 8v6M7.500 10.500L12 11.500l4.500-1M10 21l2-7 2 7"/>',
 heart:'<path d="M12 20.3s-7.5-4.6-7.5-10.4A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.5c0 5.8-7.5 10.4-7.5 10.4z"/>',
 walk:'<circle cx="13.5" cy="4.5" r="1.8"/><path d="M11.5 8.5L9 13l3 1.5-1 6M11.5 8.5l3 2.6 3 .4M12.6 14.2l2.6 2.5V21"/>',
 target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
 more:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="16" cy="12" r=".9" fill="currentColor"/>',
 ball:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l3.4 2.5-1.3 4h-4.2l-1.3-4zM12 3.5v4M15.4 10l4-1.3M14.1 14l2.4 3.4M9.9 14l-2.4 3.4M8.6 10l-4-1.3"/>',
 play:'<path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/>'
};
const svgI=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ic[n]}</svg>`;

/* ---------- Zustand & Speicher ---------- */
function norm(o){
  const s=Object.assign({},DEF,o||{});
  s.p=Object.assign({},DEF.p,(o&&o.p)||{});
  s.weights=(o&&o.weights&&o.weights.length)?o.weights:DEF.weights.slice();
  s.steps=(o&&o.steps)||{};s.workouts=(o&&o.workouts)||[];s.shifts=(o&&o.shifts)||{};s.eaten=(o&&o.eaten)||{};s.swap=(o&&o.swap)||{};s.pick=(o&&o.pick)||{};s.skipped=(o&&o.skipped)||{};s.moved=(o&&o.moved)||{};s.adj=(o&&o.adj)||0;s.adjDone=(o&&o.adjDone)||{};s.photos=(o&&o.photos)||{};s.planned=(o&&o.planned)||{};
  if(!s.mig1){s.p.kb=10;if(!s.weights.some(w=>w.d==='2026-10-04'))s.weights.push({d:'2026-10-04',kg:118});s.mig1=true}
  if(!s.p.planStart){const t0=new Date();s.p.planStart=fmt(t0.getDay()===0?addD(monOf(t0),7):monOf(t0))}
  if(!s.seeded){
    STRAVA.forEach((a,i)=>{
      let k=a[4];
      if(k==null)k=a[1]==='Lauf'?Math.round(0.92*s.p.startKg*a[2]):Math.round(8*a[3]);
      s.workouts.push({id:'s'+i,d:a[0],type:a[1],km:a[2],min:a[3],kcal:k,src:'strava'});
    });
    s.seeded=true;
  }
  Object.keys(SEED_SHIFTS).forEach(k=>{if(!(k in s.shifts))s.shifts[k]=SEED_SHIFTS[k]});
  return s;
}
let S;
try{S=norm(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){S=norm(null)}
let dbRef=null,tm=null;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(tm);tm=setTimeout(async()=>{if(dbRef){try{await dbRef.set({json:JSON.stringify(S),t:S.t})}catch(e){}}},700);
}
(async()=>{
  try{
    if(!window.claude)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbRef=db.doc('data/users/'+id+'/state');
    const snap=await dbRef.get();
    if(snap.exists){
      const remote=JSON.parse(snap.data().json);
      if((remote.t||0)>(S.t||0)){S=norm(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!ovl)render()}
      else if((S.t||0)>(remote.t||0)){dbRef.set({json:JSON.stringify(S),t:S.t}).catch(()=>{})}
    }else if(S.t){dbRef.set({json:JSON.stringify(S),t:S.t}).catch(()=>{})}
  }catch(e){}
})();

/* ---------- Berechnungen ---------- */
const lastW=()=>S.weights.slice().sort((a,b)=>a.d<b.d?-1:1).pop();
const kg=()=>lastW().kg;
const bmr=()=>10*kg()+6.25*S.p.h-5*S.p.age+5;
const runKmOn=d=>S.workouts.filter(w=>w.d===d&&(w.type==='Lauf'||w.type==='Spaziergang')).reduce((a,w)=>a+(+w.km||0),0);
const woKcalOn=d=>S.workouts.filter(w=>w.d===d).reduce((a,w)=>a+(+w.kcal||0),0);
function stepKcal(d){const st=S.steps[d];if(!st)return 0;return Math.round(Math.max(0,st-runKmOn(d)*1250-3000)*kg()*0.0004)}
function goalPlan(){
  const left=kg()-S.p.goalKg;
  const days=Math.max(1,diffDays(todayS(),S.p.goalDate));
  const need=left*7700/days;
  const d=left<=0?0:Math.min(900,Math.max(400,Math.round(need/50)*50));
  return {left,days,need,d,perWeek:d*7/7700};
}
function sollKg(ds){
  const t=Math.min(1,Math.max(0,diffDays(S.p.startDate,ds)/Math.max(1,diffDays(S.p.startDate,S.p.goalDate))));
  return S.p.startKg+(S.p.goalKg-S.p.startKg)*t;
}
function intake(){
  const g=goalPlan();
  const stepGoalK=Math.round(Math.max(0,S.p.stepGoal-3000)*kg()*0.0004);
  const raw=Math.round((bmr()*1.2+stepGoalK-g.d)/50)*50+(S.adj||0);
  return {target:Math.max(1800,raw),floor:raw<1800};
}
function paceAvg(){
  const r=S.workouts.filter(w=>w.type==='Lauf'&&w.km>3&&w.min).sort((a,b)=>a.d<b.d?1:-1).slice(0,6);
  if(!r.length)return 6.75;
  return r.reduce((a,w)=>a+w.min/w.km,0)/r.length;
}

/* ---------- Verknüpfung mit dem Torwart-Training ---------- */
function gkState(){try{return JSON.parse(localStorage.getItem('gk2')||'null')||S.gk||null}catch(e){return S.gk||null}}
const gkActive=()=>{const g=gkState();return !!(g&&g.goal)};
window.fcBridge={
  kg:()=>kg(),goalKg:()=>S.p.goalKg,goalDate:()=>S.p.goalDate,steps:()=>S.steps[todayS()]||0,stepGoal:()=>S.p.stepGoal,
  dayKind:ds=>dayKind(ds),shift:ds=>shiftOf(ds),
  session:ds=>{const s=sessionOn(ds);return s?{title:s.title,type:s.type,km:s.km,min:s.min,done:doneAny(s,ds)}:null},
  kcalTarget:ds=>dayTarget(ds),
  addWorkout:w=>{S.workouts=S.workouts.filter(x=>x.id!==w.id);S.workouts.push(Object.assign({src:'torwart',km:0},w,{kcal:w.kcal||Math.round(5*kg()*(w.min||30)/60)}));save();},
  saveGk:json=>{S.gk=json;save()},loadGk:()=>S.gk||null,
  open:t=>{tab=t;tabChanged=true;render();window.scrollTo(0,0)}
};
function gkWeek(m){const g=gkState();if(!g||!g.log)return 0;const a=+m,b=a+7*864e5;return g.log.filter(l=>l.ts>=a&&l.ts<b).length}

/* ---------- Trainings-Coach ---------- */
const shiftOf=d=>S.shifts[d]||'';
const weekNo=m=>Math.floor(diffDays(S.p.planStart,fmt(m))/7)+1;
let wkCache={};
function kbEx(variant,w){
  const lt=S.p.kb<=12,sets=w<=3?3:4,rs=lt?(w<=3?20:25):15,gr=lt?(w<=3?15:20):12;
  return variant==='A'
   ?[{k:'swing',sets,reps:String(rs)},{k:'goblet',sets:3,reps:String(gr)},{k:'rdl1',sets:3,reps:'8 je Seite'},{k:'farmer',sets:3,reps:'40 m'},{k:'plank',sets:3,reps:'30–45 s'}]
   :[{k:'clean',sets:w>=5?4:3,reps:'6 je Seite'},{k:'row',sets:3,reps:'10 je Seite'},{k:'floor',sets:3,reps:'10'},{k:'halo',sets:2,reps:'8 je Richtung'},{k:'twist',sets:3,reps:'16'}];
}
const WHEN={
 N:'Frühdienst endet 12:30, Nachtdienst beginnt 18:30: trainiere direkt danach (ca. 13:30–15:30) und kurz. Danach essen und vor dem Nachtdienst hinlegen. Heute nur die Kurzversion.',
 F1:'Nach dem Nachtdienst erst ausschlafen. Trainiere am späten Nachmittag oder Abend, locker und ohne Zeitdruck.',
 D:'Spätdienst beginnt 12:30: trainiere vormittags (z. B. 8:00–10:00) und iss danach in Ruhe vor dem Dienst. Morgen beginnt der Frühdienst um 5:30, also heute früh schlafen.',
 F2:''
};
function weekPlan(m){
  const key=fmt(m);if(wkCache[key])return wkCache[key];
  if(weekNo(m)<1){wkCache[key]={};return wkCache[key]}
  const w=Math.max(1,weekNo(m)),deload=w%4===0,f=deload?0.75:1;
  /* Kandidaten: freie Tage (F2 = ausgeruht, F1 = Tag nach dem Nachtdienst) und Früh/Nacht-Tage (Zeitfenster zwischen den Diensten) */
  const cand=[];
  for(let i=0;i<7;i++){
    const ds=fmt(addD(m,i)),sh=shiftOf(ds),prev=shiftOf(fmt(addD(m,i-1)));
    if(sh==='F')cand.push(prev==='N'?{ds,i,kind:'F1',score:2}:{ds,i,kind:'F2',score:3});
    else if(sh==='D')cand.push({ds,i,kind:'D',score:1.5});
    else if(sh==='N')cand.push({ds,i,kind:'N',score:1});
  }

  return out;

function nextSlot(){
  const t=todayS();
  for(let pass=0;pass<3;pass++)for(let i=1;i<=10;i++){
    const ds=fmt(addD(parse(t),i)),k=dayKind(ds);
    if(sessionOn(ds))continue;

}

const SNACKS=[['Hartgekochtes Ei','75 kcal · 6 g Eiweiß'],['Skyr, 150 g','95 kcal · 16 g Eiweiß'],['Mandeln, 20 g','120 kcal · 4 g Eiweiß'],['Putenbrust-Aufschnitt, 50 g','55 kcal · 11 g Eiweiß'],['Gurken- oder Paprika-Sticks','fast keine Kalorien']];
function dayKind(ds){
  const sh=shiftOf(ds),prev=shiftOf(fmt(addD(parse(ds),-1)));
  if(sh==='N')return 'N';if(sh==='D')return 'D';if(sh==='F'&&prev==='N')return 'F1';return 'F';
}
function dayTarget(ds){
  const s=sessionOn(ds);return intake().target+(s?Math.round(s.kcal*0.5/10)*10:0);
}
function scaleQ(q,u,f,int){
  let v=q*f;
  if(u==='g'||u==='ml')v=v<10?Math.round(v):Math.round(v/5)*5;
  else if(int)v=Math.max(1,Math.round(v));
  else v=Math.max(0.5,Math.round(v*2)/2);
  return v;
}
const factor=(r,tg,sh)=>Math.round(Math.min(1.7,Math.max(0.7,tg*sh/r.kcal))*20)/20;
function mealsFor(ds){
  const kind=dayKind(ds),tg=dayTarget(ds),di=diffDays('2026-01-01',ds),used=[],out=[];
  SLOTS[kind].forEach((sl,si)=>{
    const pool=R.filter(r=>r.tags.includes(sl.tag));
    let idx=(di+si*2+(S.swap[ds+'|'+si]||0))%pool.length;
    for(let k=0;k<pool.length&&used.includes(pool[idx].id);k++)idx=(idx+1)%pool.length;
    let r=pool[idx];
    const pk=S.pick[ds+'|'+si];if(pk){const pr=pool.find(x=>x.id===pk);if(pr)r=pr}
    used.push(r.id);
    const f=factor(r,tg,sl.sh);
    out.push({si,sl,r,f,key:ds+'|'+si,kcal:Math.round(r.kcal*f),p:Math.round(r.p*f),c:Math.round(r.c*f),fat:Math.round(r.f*f),
      ing:r.ing.map(i=>({n:i[0],q:i[1]?scaleQ(i[1],i[2],f,i[3]):0,u:i[2]}))});
  });
  return out;
}
function qFmt(q,u){
  if(u==='g'&&q>=1000)return nf(q/1000,1)+' kg';
  return nf(q,q%1?1:0)+' '+u;
}
function shopList(from,days){
  const m={};
  for(let i=0;i<days;i++){
    mealsFor(fmt(addD(parse(from),i))).forEach(ml=>ml.ing.forEach(g=>{
      if(!g.q)return;const k=g.n+'|'+g.u;m[k]=(m[k]||0)+g.q;
    }));
  }
  return Object.keys(m).map(k=>{const [n,u]=k.split('|');return {n,u,q:m[k]}}).sort((a,b)=>a.n.localeCompare(b.n,'de'));
}

function review(mon){
  const A=fmt(mon),B=fmt(addD(mon,6)),r={planned:0,done:0,km:0,kc:0,steps:[],hit:0,eatD:0,eatK:0,eatP:0};
  S.workouts.filter(w=>w.d>=A&&w.d<=B).forEach(w=>{r.kc+=+w.kcal||0;if(w.type==='Lauf')r.km+=+w.km||0});
  for(let i=0;i<7;i++){
    const ds=fmt(addD(mon,i)),se=sessionOn(ds);
    if(se){r.planned++;if(doneAny(se,ds))r.done++}
    const st=S.steps[ds];if(st){r.steps.push(st);if(st>=S.p.stepGoal)r.hit++}
    const ml=mealsFor(ds).filter(m=>S.eaten[m.key]);
    if(ml.length>=3){r.eatD++;r.eatK+=ml.reduce((x,m)=>x+m.kcal,0);r.eatP+=ml.reduce((x,m)=>x+m.p,0)}
  }
  r.mob=S.workouts.filter(w=>w.d>=A&&w.d<=B&&w.type==='Mobility').length;
  r.stepsAvg=r.steps.length?r.steps.reduce((a,b)=>a+b,0)/r.steps.length:0;
  r.wThis=wAvg(mon);r.wPrev=wAvg(addD(mon,-7));
  return r;
}

const TRAIN_T={F:'17:00',F1:'17:30',D:'8:30',N:'14:00'};
const tmin=(t,late)=>{const [h,m]=t.split(':').map(Number);return (h+(late?24:0))*60+m};
function dayItems(ds){

  <div class="row" style="margin-top:14px"><div class="f"><label for="wIn">Gewicht heute (kg)</label><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="${nf(kg(),1)}"></div><button data-act="addW" style="align-self:flex-end">Speichern</button></div>
  <p class="small muted" style="margin:8px 0 0">Rechnerisches Tempo: ca. ${nf(g.perWeek,2)} kg pro Woche.</p></section>`;

  /* Woche */
  let cells='';
  for(let i=0;i<7;i++){
    const d=addD(wsx.m,i),ds=fmt(d),se=wsx.plan[ds],sh2=shiftOf(ds);
    const stp=Math.min(100,(S.steps[ds]||0)/S.p.stepGoal*100);
    const tag=se?`<span class="chip ${se.type==='Lauf'?'c-run':'c-kb'}" style="padding:1px 5px;font-size:10.5px">${se.type==='Lauf'?'Lauf':'KB'}${doneFor(se)?' ✓':''}</span>`:(sh2?`<span class="chip c-${sh2}" style="padding:1px 5px;font-size:10.5px">${SHS[sh2]}</span>`:'–');
    cells+=`<div class="wd ${ds===t?'today':''}"><span class="dn">${DAYS[d.getDay()]}</span><span class="dd">${d.getDate()}</span><span class="tg">${tag}</span><span class="st"><i style="width:${stp}%"></i></span></div>`;
  }
  h+=`<section class="card"><h2>Diese Woche</h2><div class="week">${cells}</div><p class="small muted" style="margin:10px 0 0">Der Balken unter jedem Tag zeigt die Schritte im Verhältnis zum Ziel.</p></section>`;
  return h;
}

function viewVerlauf(){
  const m0=monOf(new Date());let rows='';

  for(let i=7;i>=0;i--){
    const a=addD(m0,-7*i),b=addD(a,6),A=fmt(a),B=fmt(b);
    const ws=S.workouts.filter(w=>w.d>=A&&w.d<=B);
    const km=ws.filter(w=>w.type==='Lauf').reduce((x,w)=>x+(+w.km||0),0);
    const kc=ws.reduce((x,w)=>x+(+w.kcal||0),0);
    const kb=ws.filter(w=>w.type==='Kettlebell').length;
    const sd=[];for(let j=0;j<7;j++){const v=S.steps[fmt(addD(a,j))];if(v)sd.push(v)}
    const av=sd.length?Math.round(sd.reduce((x,y)=>x+y,0)/sd.length):0;
    wk.push({a,km,kc,kb,av});mxk=Math.max(mxk,kc);

  wk.forEach(w=>{rows+=`<div class="wk"><span>${w.a.getDate()}.${w.a.getMonth()+1}.</span><div class="bar"><i style="width:${w.kc/mxk*100}%;background:var(--go)"></i></div><span>${nf(w.kc)} kcal</span></div>
  <div class="small muted">${nf(w.km,1)} km Laufen · ${w.kb}× Kettlebell${w.av?' · Ø '+nf(w.av)+' Schritte':''}</div>`});
  const wos=S.workouts.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,20);

  <section class="card"><h2>Workouts</h2><div class="list">${wos.map(w=>`<div class="it"><span><b>${parse(w.d).getDate()}.${parse(w.d).getMonth()+1}.</b> ${w.type}${w.km?' · '+nf(w.km,1)+' km':''} · ${w.min||'–'} Min · ${nf(w.kcal||0)} kcal${src(w)}</span><button class="x" data-act="delWo" data-id="${w.id}" aria-label="Löschen">✕</button></div>`).join('')||'<p class="muted">Noch nichts eingetragen.</p>'}</div></section>
  <section class="card"><h2>Schritte</h2><div class="list">${sts.map(d=>`<div class="it"><span><b>${parse(d).getDate()}.${parse(d).getMonth()+1}.</b> ${nf(S.steps[d])} Schritte</span><button class="x" data-act="delS" data-d="${d}" aria-label="Löschen">✕</button></div>`).join('')||'<p class="muted">Noch keine Schritte eingetragen.</p>'}</div></section>
  <section class="card"><h2>Gewicht</h2><div class="list">${ws.map(w=>`<div class="it"><span><b>${parse(w.d).toLocaleDateString('de-DE')}</b> ${nf(w.kg,1)} kg</span>${S.weights.length>1?`<button class="x" data-act="delW" data-d="${w.d}" aria-label="Löschen">✕</button>`:''}</div>`).join('')}</div></section>`;

  renderNav();
  const y=window.scrollY;
  if(tab==='torwart'){const f=$('#gkframe');if(f&&!f.src)f.src=f.dataset.src;$('#app').innerHTML='';return}
  $('#app').innerHTML={heute:viewHeute,plan:viewPlan,essen:viewEssen,verlauf:viewVerlauf,einst:viewEinst}[tab]();

  const ap=$('#app');
  if(ap&&ap.classList){

}

function phasesOf(rk){

  return out;
}
const routMin=rk=>Math.max(1,Math.round(phasesOf(rk).reduce((a,p)=>a+p.sec,0)/60));

function mobStreak(){
  const has=ds=>S.workouts.some(w=>w.type==='Mobility'&&w.d===ds);

}

let ACT=null,geoId=null,tick=null,wake=null;
const GPSL={wait:'GPS sucht Signal …',ok:'GPS aktiv',denied:'GPS nicht erlaubt – Strecke gleich selbst eintragen',off:'Ohne GPS'};
function loadAct(){try{ACT=JSON.parse(localStorage.getItem(AKEY)||'null')}catch(e){ACT=null}}
function saveAct(){try{ACT?localStorage.setItem(AKEY,JSON.stringify(ACT)):localStorage.removeItem(AKEY)}catch(e){}}
const hasGps=t=>t==='Lauf'||t==='Spaziergang';
const elapsed=()=>ACT?ACT.acc+(ACT.run?Date.now()-ACT.run:0):0;
function actKcal(){
  if(!ACT)return 0;const h=elapsed()/36e5,w=kg();
  if(ACT.type==='Lauf')return Math.round(ACT.km>0.2?0.92*w*ACT.km:8.5*w*h);
  if(ACT.type==='Spaziergang')return Math.round(ACT.km>0.2?0.5*w*ACT.km:3.5*w*h);
  return Math.round(6*w*h);
}
function hav(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lon-a.lon)*t;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function onPos(p){
  if(!ACT)return;const c=p.coords;
  if(ACT.gps!=='ok'){ACT.gps='ok';updGps()}
  if(c.accuracy>40||!ACT.run)return;
  const pt={lat:c.latitude,lon:c.longitude,t:p.timestamp};
  if(ACT.last){
    const dk=hav(ACT.last,pt),dt=(pt.t-ACT.last.t)/1000;
    if(dt>0&&dk>0.004&&dk/dt*3600<22){ACT.km+=dk;ACT.last=pt}
  }else ACT.last=pt;
  saveAct();
}
function startGps(){
  if(!hasGps(ACT.type)||geoId!==null)return;
  if(!navigator.geolocation){ACT.gps='off';updGps();return}
  try{geoId=navigator.geolocation.watchPosition(onPos,err=>{if(ACT){ACT.gps=err&&err.code===1?'denied':'wait';saveAct();updGps()}},{enableHighAccuracy:true,maximumAge:2000,timeout:30000})}
  catch(e){ACT.gps='off'}
}
function stopGps(){if(geoId!==null&&navigator.geolocation){try{navigator.geolocation.clearWatch(geoId)}catch(e){}}geoId=null}
async function lock(){try{if('wakeLock' in navigator&&!wake)wake=await navigator.wakeLock.request('screen');if(wake)wake.addEventListener('release',()=>{wake=null})}catch(e){}}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ACT&&ACT.run){lock();if(ACT)startGps()}});
function startAct(type,planId){
  const s=planId?sessionOn(todayS()):null;

  if(type==='Kettlebell'){
    ex=(s&&s.ex)?s.ex:kbEx(((Math.max(1,weekNo(monOf(new Date())))%2)===0)?'A':'B',Math.max(1,weekNo(monOf(new Date()))));
  }
  ACT={type,planId:(s&&s.id===planId)?planId:null,title:s?s.title:type,d:todayS(),start:Date.now(),acc:0,run:Date.now(),km:0,gps:hasGps(type)?'wait':'off',last:null,sets:{},rest:0,ex};
  saveAct();ovl='act';startGps();lock();renderOvl();startTick();
}
function startTick(){clearInterval(tick);tick=setInterval(updTick,1000)}
function updGps(){const e=$('#tGps');if(e&&ACT)e.textContent=GPSL[ACT.gps]||''}
function updTick(){
  if(!ACT||ovl!=='act')return;
  const e=elapsed(),set=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v};
  set('tTime',clock(e));set('tKcal',nf(actKcal()));

  if(ACT.rest){
    const left=Math.ceil((ACT.rest-Date.now())/1000);
    if(left<=0){ACT.rest=0;saveAct();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}set('tRest','Pause starten (40 s)')}
    else set('tRest','Pause: noch '+left+' s');

}

    else{b.dataset.sure='1';b.textContent='Wirklich löschen? Nochmal tippen'}
  }
});
